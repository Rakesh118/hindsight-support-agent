<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chat - Hindsight & Groq</title>
    <style>
        :root {
            --bg-primary: #f4f6f8;
            --bg-card: #ffffff;
            --border-color: #e0e6ed;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --user-msg: #2563eb;
            --agent-msg: #f3f4f6;
            --memory-bg: #eff6ff;
            --memory-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .customer-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .customer-selector label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .customer-selector input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .customer-selector input:focus {
            border-color: var(--primary);
        }

        .messages-area {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.agent {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.agent .message-bubble {
            background-color: var(--agent-msg);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .memory-badge {
            background: var(--memory-bg);
            border: 1px solid var(--memory-border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.8rem;
            color: #1e40af;
            margin-bottom: 6px;
        }

        .memory-badge summary {
            cursor: pointer;
            font-weight: 600;
        }

        .memory-badge ul {
            margin-top: 6px;
            padding-left: 18px;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: #ffffff;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: var(--primary);
        }

        .input-area button {
            padding: 12px 24px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .input-area button:hover {
            background-color: var(--primary-hover);
        }

        .input-area button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .error-banner {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>Support Agent</h1>
            <div class="customer-selector">
                <label for="customerId">Customer ID:</label>
                <input type="text" id="customerId" value="cust_101" placeholder="Enter customer ID">
            </div>
        </div>

        <div class="messages-area" id="messagesArea">
            <div id="errorBanner" class="error-banner"></div>
            <div class="message agent">
                <div class="message-bubble">Hello! How can I assist you today?</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const customerIdInput = document.getElementById('customerId');
        const errorBanner = document.getElementById('errorBanner');

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.style.display = 'block';
        }

        function hideError() {
            errorBanner.style.display = 'none';
            errorBanner.textContent = '';
        }

        function appendUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            msgDiv.appendChild(bubble);
            messagesArea.appendChild(msgDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function appendAgentMessage(replyText, recalledContext) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message agent';

            if (recalledContext && recalledContext.length > 0) {
                const details = document.createElement('details');
                details.className = 'memory-badge';

                const summary = document.createElement('summary');
                summary.textContent = `🧠 Recalled ${recalledContext.length} memory item(s) from Hindsight`;
                details.appendChild(summary);

                const ul = document.createElement('ul');
                recalledContext.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    ul.appendChild(li);
                });
                details.appendChild(ul);
                msgDiv.appendChild(details);
            }

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = replyText;

            msgDiv.appendChild(bubble);
            messagesArea.appendChild(msgDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            const customerId = customerIdInput.value.trim();

            if (!message) return;
            if (!customerId) {
                showError('Please enter a Customer ID.');
                return;
            }

            hideError();
            appendUserMessage(message);
            messageInput.value = '';

            messageInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_id: customerId,
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Failed to send message.');
                } else {
                    appendAgentMessage(data.reply, data.recalled_context);
                }
            } catch (err) {
                showError('Network error or server unreachable: ' + err.message);
            } finally {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
